name: CI

# Branch pushes only: PRs here come from dev in this repo, so the push
# already tested the exact commit. release.yml calls this workflow on a
# tag, so the release runs the same gates, browser suite included.
on:
  push:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

# The prefix is a literal, never github.workflow: inside a called
# workflow that expression names the caller, so a CI run called by
# release.yml would join the release's own group and cancel or block it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the release tags are present: the suite's
          # bump guard diffs each package against the newest vX.Y.Z tag.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env: { PUPPETEER_SKIP_DOWNLOAD: "1" }
      # The suite with a v8 coverage report in the log; reported, never
      # a gate (vitest.config.ts says what it measures).
      - run: npm run test:coverage
      - run: npm run lint
      - run: npm run build:site
      - run: npm run typecheck
      # The floor job runs this build in the old engines. Hidden files
      # (.well-known) ride along so the copy is the whole build; a week
      # of retention lets a failed floor job be re-run on its own.
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          include-hidden-files: true
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env: { PUPPETEER_SKIP_DOWNLOAD: "1" }
      - run: npm run build:site
      # Chrome is preinstalled at /usr/bin/google-chrome on ubuntu-latest;
      # test-kit/browser-server.ts's candidate list already finds it, so
      # no browser install step is needed for the Puppeteer suites. The
      # engine smoke runs in its own job below.
      - run: npm run test:browser --workspace site -- --exclude test/engines.test.ts
        env: { BROWSER_TESTS: "1" }

  # The engine smoke (site/test/engines.test.ts) in current Chromium,
  # Firefox, and WebKit. Playwright's own image for the pinned release
  # ships the browsers and their system libraries, so nothing is
  # installed from apt (on the bare runner that step once took over 20
  # minutes); site/test/ci-images.test.ts keeps the tag and the pin
  # together.
  engines:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist
      # Root in another user's HOME: see the floor job's note.
      - run: npx vitest run test/engines.test.ts
        working-directory: site
        env: { BROWSER_TESTS: "1", HOME: /root }

  # The demo in the browsers at the support floor (site/floor/run.mjs):
  # Chromium 99 from Playwright 1.18, Firefox 98 and WebKit 15.4 from
  # Playwright 1.21. Those builds need the system libraries of the
  # Ubuntu they were made for, so the job runs in Playwright 1.21's own
  # focal image. That image ships Node 16, which has no node:test, so
  # setup-node brings 22. site/floor is its own package: only this job
  # installs the old releases.
  floor:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.21.1-focal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/floor/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist
      - run: npm ci --prefix site/floor
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - run: npm run install-browsers --prefix site/floor
      # The container runs as root while GitHub points HOME at a mount
      # owned by the runner user, and Firefox refuses to start as root
      # in another user's home. Only this step moves HOME: the npm
      # cache above lives under the runner's.
      - run: npm test --prefix site/floor
        env: { HOME: /root }
