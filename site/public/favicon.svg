  <!-- The half-built gear (owner calls 2026-09-06): right half machined
       solid, left half a dashed layout arc where the teeth are not cut
       yet. Deliberately colorless: the site's pitch is live re-theming,
       so the mark bakes no accent, only neutral ink that flips with the
       browser's own scheme. The tiled PNG fallbacks bake the neutral
       ink ground instead, because raster icons cannot adapt. -->
